name: Deploy o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-o2switch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: https://back2mboa.com
        run: pnpm build

      - name: Pack out/ archive
        run: |
          set -euo pipefail
          test -d out
          tar -C out -czf deploy.tar.gz .
          ls -lh deploy.tar.gz

      - name: Install pv
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pv

      - name: Upload archive via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          FILE=deploy.tar.gz
          SIZE=$(stat -c%s "$FILE")
          echo "========================================"
          echo "FTP upload → ftp://$FTP_HOST/$FILE"
          echo "Size: $SIZE bytes ($(numfmt --to=iec-i --suffix=B "$SIZE"))"
          echo "========================================"
          pv -f -p -t -e -r -b -s "$SIZE" "$FILE" \
            | curl --ftp-pasv --fail --show-error \
                -u "$FTP_USER:$FTP_PASSWORD" \
                -T - \
                "ftp://$FTP_HOST/$FILE" \
                --connect-timeout 30 \
                --max-time 900 \
                -w "\n--- done ---\nbytes_uploaded=%{size_upload}\ntime=%{time_total}s\nspeed=%{speed_upload} B/s\n"
          echo "Upload OK. Cron doit extraire dans le docroot du domaine (pas le dossier Node)."
