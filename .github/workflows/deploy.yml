name: Deploy o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-o2switch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack standalone archive
        run: |
          set -euo pipefail
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          mkdir -p .next/standalone/tmp
          date -u +%Y-%m-%dT%H:%M:%SZ > .next/standalone/tmp/restart.txt
          # Flag lu par le cron o2switch pour extraire
          : > .next/standalone/tmp/DEPLOY_EXTRACT
          tar -C .next/standalone -czf deploy.tar.gz .
          ls -lh deploy.tar.gz
          echo "ARCHIVE_BYTES=$(stat -c%s deploy.tar.gz)" >> "$GITHUB_ENV"

      - name: Install pv
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pv

      - name: Upload archive via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          FILE=deploy.tar.gz
          SIZE=$(stat -c%s "$FILE")
          echo "========================================"
          echo "FTP upload → ftp://$FTP_HOST/$FILE"
          echo "Size: $SIZE bytes ($(numfmt --to=iec-i --suffix=B "$SIZE"))"
          echo "User: $FTP_USER"
          echo "========================================"
          # pv -f : barre % même sans TTY (logs GitHub Actions)
          pv -f -p -t -e -r -b -s "$SIZE" "$FILE" \
            | curl --ftp-pasv --fail --show-error \
                -u "$FTP_USER:$FTP_PASSWORD" \
                -T - \
                "ftp://$FTP_HOST/$FILE" \
                --connect-timeout 30 \
                --max-time 900 \
                -w "\n--- done ---\nbytes_uploaded=%{size_upload}\ntime=%{time_total}s\nspeed=%{speed_upload} B/s\n"
          echo "Upload terminé. Extraction côté o2switch via cron (≤1 min) ou SSH manuel :"
          echo "  cd ~/back2mboa && tar -xzf deploy.tar.gz && rm -f deploy.tar.gz && touch tmp/restart.txt"
