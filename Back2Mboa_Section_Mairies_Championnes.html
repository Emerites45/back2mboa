<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BACK2MBOA — Les 6 Mairies Championnes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ===== Tokens Back2Mboa (identiques à styles.css) ===== */
:root{
  --forest:#0A2B21; --forest-2:#11402F; --night:#061A14;
  --canvas:#FBF7EF; --canvas-2:#F3ECDD; --ink:#121915; --ink-soft:#5A6B60; --line:#E6DCC7;
  --jaune:#FFD506; --vert:#119D63; --rouge:#D8212E; --terre:#AE3C3A; --olive:#63634A;
  --aqua:#00C2A8;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Inter',system-ui,sans-serif;
  --f-serif:'Instrument Serif',Georgia,serif;
  --f-mono:'IBM Plex Mono',monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --slide-ms:6200ms;          /* durée d'affichage de chaque image */
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-body);background:var(--canvas);color:var(--ink);line-height:1.62;-webkit-font-smoothing:antialiased}
h2,h3,h4{margin:0;font-family:var(--f-display);letter-spacing:-.03em;line-height:1.06;font-weight:800}
p{margin:0}
button{font-family:inherit;cursor:pointer}

/* ===== Section ===== */
.champ{padding:clamp(56px,7vw,110px) 0}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(18px,3vw,40px)}

/* — Titre / sous-titre centrés (pattern Magnific) — */
.head{text-align:center;max-width:820px;margin:0 auto clamp(28px,3.4vw,44px)}
.head h2{font-size:clamp(2rem,4.4vw,3.3rem);color:var(--forest);margin-bottom:14px}
.head h2 em{font-style:normal;color:var(--rouge)}
.head p{color:var(--ink-soft);font-size:clamp(1rem,1.25vw,1.14rem);max-width:62ch;margin:0 auto}

/* — Menu flottant en pilule — */
.pills{
  display:flex;justify-content:center;margin-bottom:clamp(20px,2.4vw,30px);
  position:sticky;top:14px;z-index:20;
}
.pills-inner{
  display:flex;gap:2px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:5px;box-shadow:0 10px 32px -16px rgba(10,43,33,.42);
  overflow-x:auto;max-width:100%;scrollbar-width:none;
}
.pills-inner::-webkit-scrollbar{display:none}
.pill{
  border:0;background:transparent;border-radius:999px;white-space:nowrap;
  padding:11px 19px;font-size:.85rem;font-weight:600;color:var(--ink-soft);
  display:flex;align-items:center;gap:8px;transition:.28s var(--ease);
}
.pill:hover{color:var(--forest);background:rgba(10,43,33,.06)}
.pill.on{background:var(--forest);color:#fff}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dot);flex:none;font-style:normal}
.pill.on i{background:var(--jaune)}
.pill span.reg{font-family:var(--f-mono);font-size:.68rem;opacity:.62;font-weight:500}

/* ===== Le grand canva ===== */
.canva{
  background:var(--forest);border-radius:clamp(20px,2.2vw,30px);overflow:hidden;
  display:grid;grid-template-columns:1fr;min-height:620px;position:relative;
}
@media(min-width:980px){.canva{grid-template-columns:38% 62%}}

/* — Colonne gauche : infos percutantes + CTA + liste des 3 volets — */
.left{padding:clamp(26px,2.8vw,44px);display:flex;flex-direction:column;position:relative;z-index:3}
.sector-tag{
  display:inline-flex;align-items:center;gap:9px;align-self:flex-start;
  font-family:var(--f-mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tint);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  padding:7px 14px;border-radius:999px;margin-bottom:18px;
}
.left h3{font-size:clamp(1.5rem,2.3vw,2.05rem);color:#fff;margin-bottom:14px}
.left h3 em{font-style:normal;color:var(--tint)}
.lead{color:rgba(255,255,255,.72);font-size:.96rem;margin-bottom:22px;max-width:44ch}

/* chiffres percutants */
.stats{display:flex;gap:20px;flex-wrap:wrap;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid rgba(255,255,255,.14)}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(1.25rem,1.9vw,1.65rem);color:var(--tint);font-weight:800;line-height:1}
.stat span{font-size:.7rem;color:rgba(255,255,255,.55);font-family:var(--f-mono);letter-spacing:.04em}

/* CTA */
.ctas{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:26px}
.cta{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;
  font-size:.83rem;padding:12px 21px;border-radius:999px;border:1.5px solid transparent;
  transition:.3s var(--ease);text-decoration:none;
}
.cta-1{background:var(--tint);color:var(--forest)}
.cta-1:hover{filter:brightness(1.1);transform:translateY(-2px)}
.cta-2{border-color:rgba(255,255,255,.4);color:#fff;background:transparent}
.cta-2:hover{background:rgba(255,255,255,.12);border-color:#fff;transform:translateY(-2px)}
.cta .arw{transition:transform .3s var(--ease)}
.cta:hover .arw{transform:translateX(4px)}

/* liste des 3 volets — celui actif porte la barre de progression */
.steps{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.step{
  border:0;background:transparent;text-align:left;padding:15px 0 0;position:relative;
  border-top:1px solid rgba(255,255,255,.14);color:inherit;
}
.step:first-child{border-top:0}
.step-h{display:flex;align-items:center;gap:11px}
.step-h b{font-family:var(--f-display);font-size:.94rem;font-weight:700;color:rgba(255,255,255,.58);transition:.3s}
.step.on .step-h b{color:#fff}
.step-h .n{font-family:var(--f-mono);font-size:.66rem;color:rgba(255,255,255,.34)}
.step.on .step-h .n{color:var(--tint)}
.step p{
  font-size:.85rem;color:rgba(255,255,255,.6);max-height:0;overflow:hidden;
  transition:max-height .5s var(--ease),margin .5s var(--ease),opacity .4s;opacity:0;margin-top:0;
}
.step.on p{max-height:90px;margin-top:8px;opacity:1}
.bar{height:2px;background:rgba(255,255,255,.14);margin-top:13px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--tint);border-radius:2px}
.step.on .bar i{animation:fill var(--slide-ms) linear forwards}
@keyframes fill{to{width:100%}}

/* — Colonne droite : les 3 images qui défilent + carte d'information centrale — */
.right{position:relative;min-height:380px;overflow:hidden}
.shot{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity .9s var(--ease),transform 7s linear}
.shot.on{opacity:1;transform:scale(1)}
.shot svg{width:100%;height:100%;display:block}
.shot-veil{position:absolute;inset:0;background:linear-gradient(115deg,rgba(6,26,20,.86) 0%,rgba(6,26,20,.34) 42%,rgba(6,26,20,.12) 100%)}

/* carte d'information centrale posée sur les images */
.overlay{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  width:min(410px,84%);background:rgba(251,247,239,.97);border-radius:20px;
  padding:22px 24px;box-shadow:0 30px 70px -24px rgba(0,0,0,.62);backdrop-filter:blur(8px);
}
.ov-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.ov-who{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:.88rem;color:var(--forest)}
.ov-who .dot{width:9px;height:9px;border-radius:50%;background:var(--tint)}
.ov-step{font-family:var(--f-mono);font-size:.63rem;color:var(--ink-soft);letter-spacing:.1em}
.ov-val{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,2.6vw,2.3rem);color:var(--forest);line-height:1;letter-spacing:-.04em;margin-bottom:7px}
.ov-val em{font-style:normal;color:var(--rouge)}
.ov-cap{font-size:.85rem;color:var(--ink-soft);margin-bottom:15px}
.ov-line{display:flex;align-items:center;gap:9px;font-size:.79rem;color:var(--forest);padding-top:13px;border-top:1px solid var(--line)}
.ov-line .chk{width:15px;height:15px;border-radius:50%;background:var(--vert);color:#fff;display:grid;place-items:center;font-size:.58rem;flex:none}
.ov-fade{animation:ovIn .55s var(--ease)}
@keyframes ovIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* pastilles de progression sur mobile */
.dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
.dots i.on{background:var(--tint);width:20px;border-radius:99px}

@media(prefers-reduced-motion:reduce){
  .step.on .bar i{animation:none;width:100%}
  .shot{transition:opacity .3s}
  .shot.on{transform:none}
}
</style>
</head>
<body>

<section class="champ">
  <div class="wrap">

    <!-- Titre + sous-titre -->
    <div class="head">
      <h2>Six mairies. Six secteurs. <em>Un seul mouvement.</em></h2>
      <p>Chaque Mairie Championne porte un secteur prioritaire, un Mayor Call™ documenté et un cas d'usage réel. Choisissez un territoire pour découvrir son potentiel.</p>
    </div>

    <!-- Menu flottant -->
    <nav class="pills" aria-label="Mairies championnes">
      <div class="pills-inner" id="pills"></div>
    </nav>

    <!-- Grand canva -->
    <div class="canva" id="canva">
      <div class="left">
        <span class="sector-tag" id="sectorTag"></span>
        <h3 id="headline"></h3>
        <p class="lead" id="lead"></p>
        <div class="stats" id="stats"></div>
        <div class="ctas">
          <a class="cta cta-1" id="cta1" href="#">Découvrir le Mayor Call™ <span class="arw">→</span></a>
          <a class="cta cta-2" href="#">Devenir partenaire du secteur</a>
        </div>
        <div class="steps" id="steps"></div>
      </div>
      <div class="right" id="right">
        <div class="overlay" id="overlay"></div>
        <div class="dots" id="dots"></div>
      </div>
    </div>

  </div>
</section>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);

/* ======================================================================
   MOTEUR DE SCÈNES — paysages vectoriels (identique au site Back2Mboa)
   ====================================================================== */
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>((s=s*16807%2147483647)-1)/2147483646;}
const PAL={
  verdant:{sky:["#D6EFD2","#93CFA0","#3F8B63","#1C4A36"],ridge:["#5B9E70","#3E7C57","#2A5B40","#173A2A"],glow:"#A8E0A4"},
  nocturne:{sky:["#4B5FC4","#2E3277","#181B47","#080A1E"],ridge:["#2C3160","#242A5E","#181C42","#0C0E26"],glow:"#5C6BD8"},
  savanna:{sky:["#FFE9B8","#F7C069","#C98246","#6B4028"],ridge:["#B27C4C","#8E5F3B","#65422A","#3E281A"],glow:"#F5B45E"},
  ocean:{sky:["#BDEDE8","#63CBC6","#1E8891","#0A3A46"],ridge:["#3FA3A6","#25787F","#155259","#08303A"],glow:"#7FE2DA"},
  emerald:{sky:["#C9F0DC","#6FC7A0","#2C8A6A","#10402F"],ridge:["#4FA37E","#347E62","#215C47","#10402F"],glow:"#8FDCBB"},
  dawn:{sky:["#FFC79A","#FB8F63","#B4526E","#3B2B54"],ridge:["#8B5F79","#6B4566","#4A3054","#2C1D3C"],glow:"#FF9A6B"},
};
let uid=0;
function scene(palName,fg,seed){
  const p=PAL[palName],rand=rng(seed),w=1200,h=820,id="s"+(++uid);
  let out=`<defs>
    <linearGradient id="sky${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${p.sky[0]}"/><stop offset="34%" stop-color="${p.sky[1]}"/>
      <stop offset="68%" stop-color="${p.sky[2]}"/><stop offset="100%" stop-color="${p.sky[3]}"/></linearGradient>
    <radialGradient id="gl${id}"><stop offset="0%" stop-color="${p.glow}" stop-opacity=".78"/>
      <stop offset="60%" stop-color="${p.glow}" stop-opacity=".2"/>
      <stop offset="100%" stop-color="${p.glow}" stop-opacity="0"/></radialGradient>
  </defs><rect width="${w}" height="${h}" fill="url(#sky${id})"/>`;
  out+=`<circle cx="${(w*(.25+rand()*.5)).toFixed(0)}" cy="${(h*.2).toFixed(0)}" r="${(h*.44).toFixed(0)}" fill="url(#gl${id})"/>`;
  for(let i=0;i<4;i++){
    const t=i/3, baseY=h*(.40+t*.34), amp=h*(.115-t*.05);
    let d=`M-30 ${h+30} L-30 ${baseY.toFixed(1)}`;
    for(let k=0;k<=6;k++){
      const x=(w/6*k).toFixed(1);
      const y=(baseY+Math.sin(k*1.1+i*2.3)*amp*(.5+rand()*.7)-rand()*amp*.4).toFixed(1);
      d+=` L${x} ${y}`;
    }
    d+=` L${w+30} ${baseY.toFixed(1)} L${w+30} ${h+30} Z`;
    out+=`<path d="${d}" fill="${p.ridge[Math.min(i,3)]}" fill-opacity="${(.72+t*.28).toFixed(2)}"/>`;
  }
  const fc=p.ridge[3];
  if(fg==="crops"){
    for(let i=0;i<26;i++){const x=(-10+i*(w/25)).toFixed(1);
      out+=`<path d="M${x} ${h} L${x} ${h-62} M${x} ${h-34} l-11 -13 M${x} ${h-34} l11 -13" stroke="${fc}" stroke-width="3" fill="none" stroke-linecap="round"/>`;}
  } else if(fg==="city"){
    let x=-20;while(x<w+20){const bw=34+rand()*58,bh=h*(.1+rand()*.27);
      out+=`<rect x="${x.toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${(bh+30).toFixed(1)}" fill="${fc}"/>`;
      for(let wy=0;wy<Math.floor(bh/26);wy++)for(let wx=0;wx<Math.floor(bw/20);wx++)
        if(rand()>.55) out+=`<rect x="${(x+8+wx*20).toFixed(1)}" y="${(h-bh+12+wy*26).toFixed(1)}" width="6" height="9" fill="#FFD79A" opacity="${(.3+rand()*.5).toFixed(2)}"/>`;
      x+=bw+9;}
  } else if(fg==="palms"){
    for(let i=0;i<6;i++){const x=w*.08+rand()*w*.84,ht=h*(.2+rand()*.18);
      out+=`<path d="M${x.toFixed(1)} ${h} Q ${(x+7).toFixed(1)} ${(h-ht*.6).toFixed(1)}, ${(x+4).toFixed(1)} ${(h-ht).toFixed(1)}" stroke="${fc}" stroke-width="5" fill="none"/>`;
      for(let f=0;f<6;f++){const a=-140+f*32,r=ht*.42;
        const ex=x+4+Math.cos(a*Math.PI/180)*r, ey=h-ht+Math.sin(a*Math.PI/180)*r*.62;
        out+=`<path d="M${(x+4).toFixed(1)} ${(h-ht).toFixed(1)} Q ${((x+4+ex)/2).toFixed(1)} ${(h-ht-16).toFixed(1)}, ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${fc}" stroke-width="4" fill="none" stroke-linecap="round"/>`;}}
  } else if(fg==="solar"){
    for(let i=0;i<5;i++){const x=w*.06+i*(w/5.4),yy=h-h*.11;
      out+=`<g transform="translate(${x.toFixed(1)} ${yy.toFixed(1)}) skewY(-13)"><rect width="${(w*.056).toFixed(1)}" height="${(h*.05).toFixed(1)}" fill="${fc}"/></g>`;
      out+=`<rect x="${(x+w*.026).toFixed(1)}" y="${(yy+h*.045).toFixed(1)}" width="5" height="${(h*.065).toFixed(1)}" fill="${fc}"/>`;}
  } else if(fg==="village"){
    for(let i=0;i<7;i++){const x=w*.04+rand()*w*.84,bw=w*.05+rand()*w*.03,bh=h*.05+rand()*h*.03;
      out+=`<path d="M${x.toFixed(1)} ${h} L${x.toFixed(1)} ${(h-bh).toFixed(1)} L${(x+bw/2).toFixed(1)} ${(h-bh-h*.03).toFixed(1)} L${(x+bw).toFixed(1)} ${(h-bh).toFixed(1)} L${(x+bw).toFixed(1)} ${h} Z" fill="${fc}"/>`;}
  }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${out}</svg>`;
}

/* ======================================================================
   DONNÉES — 6 mairies championnes
   ====================================================================== */
const MAIRIES=[
 {
  id:"babadjou", nom:"Babadjou", region:"Ouest", tint:"var(--vert)", dot:"#119D63",
  secteur:"I — Agriculture & Agro-industrie",
  headline:"4 000 tonnes qui attendent <em>leur industrie</em>.",
  lead:"Pommes de terre, maïs, haricots, café, élevage. La production existe. La transformation locale, pas encore.",
  stats:[["4 000 t","récolte / an"],["40 %","de pertes"],["50","emplois visés"]],
  slides:[
   {t:"Le potentiel",d:"Une commune des hauts plateaux qui produit chaque année 4 000 tonnes de pommes de terre.",
    pal:"verdant",fg:"crops",seed:11, ovStep:"01 · POTENTIEL", ovVal:"4 000 <em>tonnes</em>", ovCap:"Production annuelle de pommes de terre, sans unité de transformation sur le territoire.", ovLine:"Chaîne de valeur : production → collecte → transformation"},
   {t:"Le Mayor Call™",d:"Le Maire publie son besoin : une micro-industrie de transformation et une chaîne du froid.",
    pal:"verdant",fg:"village",seed:12, ovStep:"02 · MAYOR CALL™", ovVal:"40 % <em>de pertes</em>", ovCap:"Faute de chaîne du froid et d'unité de transformation, près de la moitié de la récolte se perd.", ovLine:"Besoin qualifié selon la méthode CAP™"},
   {t:"La connexion",d:"Un Bâtisseur Solutionneur de la diaspora, en Arizona, apporte la technicité et les partenaires.",
    pal:"dawn",fg:"crops",seed:13, ovStep:"03 · SUCCESS STORY", ovVal:"50 <em>emplois</em>", ovCap:"Frites surgelées, purée déshydratée, chips : l'unité de transformation vise l'export vers l'Europe.", ovLine:"Connecté à l'ANOR, au MINADER et au PAD"}
  ]
 },
 {
  id:"douala3", nom:"Douala III", region:"Littoral", tint:"#5B8CF5", dot:"#2E6BE6",
  secteur:"II — Finance, Fiscalité, Paiements & Digital",
  headline:"Des recettes qui dorment encore <em>en espèces</em>.",
  lead:"Taxes de marché, permis, services municipaux : peu digitalisés, donc peu traçables et sous-mobilisés.",
  stats:[["29","communes"],["2,5 M+","habitants"],["6","maillons"]],
  slides:[
   {t:"Le potentiel",d:"La commune la plus peuplée de son arrondissement, avec une base fiscale locale importante.",
    pal:"nocturne",fg:"city",seed:21, ovStep:"01 · POTENTIEL", ovVal:"2,5 M+ <em>habitants</em>", ovCap:"Le secteur Finance & Digital couvre les 29 communes du réseau Back2Mboa.", ovLine:"Chaîne de valeur : mobilisation → développement → distribution"},
   {t:"Le Mayor Call™",d:"Digitaliser la collecte : paiement mobile des taxes de marché, des permis et des services.",
    pal:"nocturne",fg:"city",seed:22, ovStep:"02 · MAYOR CALL™", ovVal:"GovTech <em>recherchée</em>", ovCap:"Pertes de recettes, manque de traçabilité, faible capacité de mobilisation des ressources locales.", ovLine:"Besoin qualifié selon la méthode CAP™"},
   {t:"La connexion",d:"Un Solutionneur diaspora spécialisé en plateformes GovTech et paiement numérique.",
    pal:"savanna",fg:"city",seed:23, ovStep:"03 · SUCCESS STORY", ovVal:"Recettes <em>traçables</em>", ovCap:"Établissements financiers, opérateurs de paiement et régulateurs réunis autour d'une solution conforme.", ovLine:"Services publics plus accessibles aux citoyens"}
  ]
 },
 {
  id:"mbalmayo", nom:"Mbalmayo", region:"Centre", tint:"#D99A5C", dot:"#AE3C3A",
  secteur:"III — Foncier, Immobilier, Habitat & Construction",
  headline:"300 hectares le long <em>du corridor</em>.",
  lead:"Croissance périurbaine, réserve foncière disponible, proximité d'un grand axe économique.",
  stats:[["300 ha","réserve"],["13","communes"],["1,8 M+","habitants"]],
  slides:[
   {t:"Le potentiel",d:"Une réserve foncière située le long de la Nationale N°3, axe économique majeur.",
    pal:"savanna",fg:"village",seed:31, ovStep:"01 · POTENTIEL", ovVal:"300 <em>hectares</em>", ovCap:"De quoi accueillir une zone industrielle, un parc logistique, des logements sociaux.", ovLine:"Chaîne de valeur : identification → aménagement → commercialisation"},
   {t:"Le Mayor Call™",d:"Études de faisabilité, schémas d'aménagement et sécurisation des titres fonciers.",
    pal:"savanna",fg:"city",seed:32, ovStep:"02 · MAYOR CALL™", ovVal:"Dossier <em>bancable</em>", ovCap:"Sans études ni titres sécurisés, le potentiel reste invisible pour les investisseurs.", ovLine:"Besoin qualifié selon la méthode CAP™"},
   {t:"La connexion",d:"Urbanistes, géomètres, promoteurs, banques — et le MINDCAF, le MINDHU, le FEICOM.",
    pal:"dawn",fg:"city",seed:33, ovStep:"03 · SUCCESS STORY", ovVal:"Centaines <em>d'emplois</em>", ovCap:"Réserves valorisées, infrastructures réalisées, recettes communales en hausse.", ovLine:"Territoire rendu attractif pour les entreprises"}
  ]
 },
 {
  id:"limbe1", nom:"Limbé I", region:"Sud-Ouest", tint:"var(--jaune)", dot:"#FFD506",

/* ======================================================================
   RENDU + INTERACTIONS
   ====================================================================== */
const pills=$("#pills"), right=$("#right"), stepsEl=$("#steps"),
      overlay=$("#overlay"), dotsEl=$("#dots"), canva=$("#canva");
let iM=0, iS=0, timer=null;

// menu flottant
MAIRIES.forEach((m,i)=>{
  const b=document.createElement("button");
  b.className="pill"+(i===0?" on":"");
  b.style.setProperty("--dot",m.dot);
  b.innerHTML=`<i></i>${m.nom} <span class="reg">${m.region}</span>`;
  b.addEventListener("click",()=>selectMairie(i));
  pills.appendChild(b);
});

function selectMairie(i){
  iM=i; iS=0;
  const m=MAIRIES[i];
  [...pills.children].forEach((p,k)=>p.classList.toggle("on",k===i));
  canva.style.setProperty("--tint",m.tint);

  $("#sectorTag").textContent=m.secteur;
  $("#headline").innerHTML=m.headline;
  $("#lead").textContent=m.lead;
  $("#stats").innerHTML=m.stats.map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  $("#cta1").innerHTML=`Découvrir le Mayor Call™ de ${m.nom} <span class="arw">→</span>`;

  // les 3 volets
  stepsEl.innerHTML=m.slides.map((s,k)=>`
    <button class="step${k===0?" on":""}" data-k="${k}">
      <div class="step-h"><span class="n">0${k+1}</span><b>${s.t}</b></div>
      <p>${s.d}</p>
      <div class="bar"><i></i></div>
    </button>`).join("");
  [...stepsEl.children].forEach(b=>b.addEventListener("click",()=>{goSlide(+b.dataset.k);restart();}));

  // les 3 images
  right.querySelectorAll(".shot").forEach(n=>n.remove());
  m.slides.forEach((s,k)=>{
    const d=document.createElement("div");
    d.className="shot"+(k===0?" on":"");
    d.innerHTML=scene(s.pal,s.fg,s.seed)+'<div class="shot-veil"></div>';
    right.insertBefore(d,overlay);
  });

  dotsEl.innerHTML=m.slides.map((_,k)=>`<i class="${k===0?"on":""}"></i>`).join("");
  paintOverlay(0);
  restart();
}

function paintOverlay(k){
  const m=MAIRIES[iM], s=m.slides[k];
  overlay.className="overlay ov-fade";
  overlay.innerHTML=`
    <div class="ov-top">
      <div class="ov-who"><span class="dot"></span>${m.nom} — ${m.region}</div>
      <div class="ov-step">${s.ovStep}</div>
    </div>
    <div class="ov-val">${s.ovVal}</div>
    <div class="ov-cap">${s.ovCap}</div>
    <div class="ov-line"><span class="chk">✓</span>${s.ovLine}</div>`;
  void overlay.offsetWidth;
}

function goSlide(k){
  iS=k;
  const shots=right.querySelectorAll(".shot");
  shots.forEach((n,i)=>n.classList.toggle("on",i===k));
  [...stepsEl.children].forEach((b,i)=>b.classList.remove("on"));
  const active=stepsEl.children[k];
  void active.offsetWidth;          // relance l'animation de la barre
  active.classList.add("on");
  [...dotsEl.children].forEach((d,i)=>d.classList.toggle("on",i===k));
  paintOverlay(k);
}

function restart(){
  clearInterval(timer);
  const ms=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--slide-ms"))||6200;
  timer=setInterval(()=>goSlide((iS+1)%MAIRIES[iM].slides.length),ms);
}

// pause au survol du canva
canva.addEventListener("mouseenter",()=>clearInterval(timer));
canva.addEventListener("mouseleave",restart);

selectMairie(0);
})();
</script>
