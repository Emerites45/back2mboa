<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" fill="none">
  <title>Back2Mboa — Carousel 6 Mairies Championnes (Figma import)</title>
  <desc>Section Magnific-style : titre, menu flottant, stage, métriques, CTAs, stack images. Calques nommés pour Figma.</desc>

  <!-- ================== FONDS ================== -->
  <g id="00_Background">
    <rect width="1440" height="1020" fill="#061A14"/>
    <ellipse cx="420" cy="180" rx="480" ry="320" fill="#11402F" opacity="0.55"/>
    <ellipse cx="1100" cy="700" rx="400" ry="280" fill="#0A2B21" opacity="0.8"/>
  </g>

  <!-- ================== HEADER ================== -->
  <g id="01_Header">
    <text id="Kicker" x="720" y="56" text-anchor="middle" fill="#FFD506" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">BACK2MBOA ASAP™  ·  ÉDITION 2026</text>
    <text id="Title" x="720" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">6 mairies championnes · </text>
    <text id="Title_Accent" x="1048" y="108" text-anchor="start" fill="#FFD506" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">6 secteurs</text>
    <!-- Title layout fix: single line centered alternative -->
    <text id="Title_Full" x="720" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.8" opacity="0">6 mairies championnes · 6 secteurs</text>
    <text id="Subtitle" x="720" y="148" text-anchor="middle" fill="#A8BDB2" font-family="Inter, Arial, sans-serif" font-size="16">
      Chaque territoire porte un Mayor Call™, un cas d’usage et un pipeline de solutions.
    </text>
    <text id="Subtitle_2" x="720" y="170" text-anchor="middle" fill="#A8BDB2" font-family="Inter, Arial, sans-serif" font-size="16">
      Explorez le potentiel économique et les success stories.
    </text>
  </g>

  <!-- ================== NAV PILLS ================== -->
  <g id="02_Nav_Floating">
    <!-- Babadjou active -->
    <g id="Nav_Babadjou_Active">
      <rect x="198" y="198" width="118" height="40" rx="20" fill="#FFD506"/>
      <circle cx="220" cy="218" r="4" fill="#4F8A3C"/>
      <text x="232" y="223" fill="#061A14" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Babadjou</text>
    </g>
    <g id="Nav_Douala3">
      <rect x="328" y="198" width="122" height="40" rx="20" fill="#0A2B21" stroke="#2A4A3C" stroke-width="1"/>
      <circle cx="350" cy="218" r="4" fill="#1F4E79"/>
      <text x="362" y="223" fill="#C8D9D0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Douala III</text>
    </g>
    <g id="Nav_Mbalmayo">
      <rect x="462" y="198" width="124" height="40" rx="20" fill="#0A2B21" stroke="#2A4A3C" stroke-width="1"/>
      <circle cx="484" cy="218" r="4" fill="#C66A2B"/>
      <text x="496" y="223" fill="#C8D9D0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Mbalmayo</text>
    </g>
    <g id="Nav_Limbe">
      <rect x="598" y="198" width="108" height="40" rx="20" fill="#0A2B21" stroke="#2A4A3C" stroke-width="1"/>
      <circle cx="620" cy="218" r="4" fill="#F2B632"/>
      <text x="632" y="223" fill="#C8D9D0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Limbé I</text>
    </g>
    <g id="Nav_Fundong">
      <rect x="718" y="198" width="112" height="40" rx="20" fill="#0A2B21" stroke="#2A4A3C" stroke-width="1"/>
      <circle cx="740" cy="218" r="4" fill="#168AAD"/>
      <text x="752" y="223" fill="#C8D9D0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Fundong</text>
    </g>
    <g id="Nav_Guider">
      <rect x="842" y="198" width="100" height="40" rx="20" fill="#0A2B21" stroke="#2A4A3C" stroke-width="1"/>
      <circle cx="864" cy="218" r="4" fill="#D8212E"/>
      <text x="876" y="223" fill="#C8D9D0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Guider</text>
    </g>
    <!-- hint inactive states for other slides as separate frames if needed -->
  </g>

  <!-- ================== STAGE ================== -->
  <g id="03_Stage">
    <!-- Stage frame -->
    <rect id="Stage_Frame" x="120" y="268" width="1200" height="560" rx="22" fill="#0D1A15" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- soft shadow approximation -->
    <rect x="128" y="276" width="1184" height="544" rx="20" fill="#061A14" opacity="0.35"/>

    <!-- Slide background (Babadjou active) -->
    <g id="04_Slide_Babadjou">
      <defs>
        <linearGradient id="bgBabadjou" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1A3D28"/>
          <stop offset="50%" stop-color="#0D2818"/>
          <stop offset="100%" stop-color="#1F4A30"/>
        </linearGradient>
        <linearGradient id="veil" x1="0" y1="0.5" x2="1" y2="0.5">
          <stop offset="0%" stop-color="#061A14" stop-opacity="0.92"/>
          <stop offset="42%" stop-color="#061A14" stop-opacity="0.72"/>
          <stop offset="100%" stop-color="#061A14" stop-opacity="0.22"/>
        </linearGradient>
        <clipPath id="stageClip">
          <rect x="120" y="268" width="1200" height="560" rx="22"/>
        </clipPath>
      </defs>
      <g clip-path="url(#stageClip)">
        <rect x="120" y="268" width="1200" height="560" fill="url(#bgBabadjou)"/>
        <!-- decorative circles as photo placeholders depth -->
        <circle cx="1080" cy="480" r="220" fill="#2A5A3A" opacity="0.35"/>
        <circle cx="1180" cy="360" r="140" fill="#3A7A4A" opacity="0.2"/>
        <rect x="120" y="268" width="1200" height="560" fill="url(#veil)"/>
      </g>

      <!-- LEFT CONTENT -->
      <g id="05_Content_Left">
        <!-- Sector pill -->
        <g id="Sector_Pill">
          <rect x="160" y="304" width="248" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.14)"/>
          <rect x="172" y="314" width="8" height="8" rx="2" fill="#4F8A3C"/>
          <text x="188" y="323" fill="#EAF3EC" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">AGRICULTURE &amp; AGRO-INDUSTRIE</text>
        </g>

        <text id="Mairie_Name" x="160" y="372" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">Babadjou</text>
        <text id="Region" x="160" y="398" fill="#8FA89A" font-family="Inter, Arial, sans-serif" font-size="14">Ouest · Commune urbaine</text>

        <text id="Hook_1" x="160" y="434" fill="#D5E6DB" font-family="Inter, Arial, sans-serif" font-size="15">Cœur productif des hauts plateaux : pommes de terre,</text>
        <text id="Hook_2" x="160" y="456" fill="#D5E6DB" font-family="Inter, Arial, sans-serif" font-size="15">maïs, haricots, café et élevage. Le Mayor Call™ vise</text>
        <text id="Hook_3" x="160" y="478" fill="#D5E6DB" font-family="Inter, Arial, sans-serif" font-size="15">la transformation locale et la réduction des pertes.</text>

        <!-- Metrics -->
        <g id="06_Metrics">
          <g id="Metric_1">
            <rect x="160" y="500" width="150" height="64" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
            <text x="235" y="528" text-anchor="middle" fill="#FFD506" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="800">2 Md</text>
            <text x="235" y="548" text-anchor="middle" fill="#7A9A8A" font-family="Inter, Arial, sans-serif" font-size="10">FCFA pipeline transform.</text>
          </g>
          <g id="Metric_2">
            <rect x="322" y="500" width="150" height="64" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
            <text x="397" y="528" text-anchor="middle" fill="#FFD506" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="800">~40 %</text>
            <text x="397" y="548" text-anchor="middle" fill="#7A9A8A" font-family="Inter, Arial, sans-serif" font-size="10">pertes post-récolte</text>
          </g>
          <g id="Metric_3">
            <rect x="484" y="500" width="150" height="64" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
            <text x="559" y="528" text-anchor="middle" fill="#FFD506" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="800">Chaîne</text>
            <text x="559" y="548" text-anchor="middle" fill="#7A9A8A" font-family="Inter, Arial, sans-serif" font-size="10">froid · collecte · export</text>
          </g>
        </g>

        <!-- Story -->
        <g id="07_Success_Story">
          <rect x="160" y="580" width="3" height="52" fill="#FFD506"/>
          <text x="176" y="596" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Success story en construction.</text>
          <text x="176" y="616" fill="#9BB5A8" font-family="Inter, Arial, sans-serif" font-size="12">Structurer une unité de transformation (frites, purée, farine)</text>
          <text x="176" y="634" fill="#9BB5A8" font-family="Inter, Arial, sans-serif" font-size="12">et un corridor logistique diaspora-compatible.</text>
        </g>

        <!-- CTAs -->
        <g id="08_CTAs">
          <g id="CTA_Primary">
            <rect x="160" y="662" width="188" height="44" rx="22" fill="#FFD506"/>
            <text x="254" y="690" text-anchor="middle" fill="#061A14" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Voir le Mayor Call™</text>
          </g>
          <g id="CTA_Ghost">
            <rect x="360" y="662" width="168" height="44" rx="22" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
            <text x="444" y="690" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Je peux répondre</text>
          </g>
        </g>
      </g>

      <!-- RIGHT IMAGE STACK -->
      <g id="09_Image_Stack">
        <!-- back card -->
        <g id="Img_Card_3" opacity="0.35">
          <rect x="980" y="340" width="280" height="350" rx="16" fill="#1A3328" stroke="rgba(255,255,255,0.08)" transform="translate(12, 8) scale(0.94)"/>
        </g>
        <!-- mid card -->
        <g id="Img_Card_2" opacity="0.55">
          <rect x="990" y="330" width="280" height="350" rx="16" fill="#243F32" stroke="rgba(255,255,255,0.1)" transform="translate(6, 4) scale(0.97)"/>
        </g>
        <!-- front card (active) -->
        <g id="Img_Card_1_Active">
          <rect x="1000" y="320" width="280" height="350" rx="16" fill="#2A5A3A" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <!-- photo placeholder pattern -->
          <g clip-path="url(#imgClip)">
            <defs>
              <clipPath id="imgClip">
                <rect x="1000" y="320" width="280" height="350" rx="16"/>
              </clipPath>
            </defs>
            <rect x="1000" y="320" width="280" height="350" fill="#3D7A52"/>
            <ellipse cx="1140" cy="420" rx="120" ry="80" fill="#4F8A3C" opacity="0.5"/>
            <ellipse cx="1080" cy="500" rx="90" ry="60" fill="#2E6B40" opacity="0.6"/>
            <!-- field lines suggestion -->
            <path d="M1000 580 Q1140 540 1280 600" stroke="#FFD506" stroke-width="2" opacity="0.25" fill="none"/>
            <path d="M1000 600 Q1140 560 1280 620" stroke="#FFD506" stroke-width="1.5" opacity="0.15" fill="none"/>
          </g>
          <!-- caption bar -->
          <rect x="1000" y="590" width="280" height="80" fill="url(#capGrad)"/>
          <defs>
            <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#061A14" stop-opacity="0"/>
              <stop offset="40%" stop-color="#061A14" stop-opacity="0.85"/>
              <stop offset="100%" stop-color="#061A14" stop-opacity="0.95"/>
            </linearGradient>
          </defs>
          <text x="1016" y="628" fill="#FFD506" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">PRODUCTION</text>
          <text x="1016" y="650" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Pommes de terre &amp; cultures de plateau</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================== FOOTER CONTROLS ================== -->
  <g id="10_Stage_Footer">
    <!-- Dots -->
    <g id="Dots">
      <rect x="120" y="852" width="40" height="4" rx="2" fill="#FFD506"/>
      <rect x="168" y="852" width="28" height="4" rx="2" fill="rgba(255,255,255,0.18)"/>
      <rect x="204" y="852" width="28" height="4" rx="2" fill="rgba(255,255,255,0.18)"/>
      <rect x="240" y="852" width="28" height="4" rx="2" fill="rgba(255,255,255,0.18)"/>
      <rect x="276" y="852" width="28" height="4" rx="2" fill="rgba(255,255,255,0.18)"/>
      <rect x="312" y="852" width="28" height="4" rx="2" fill="rgba(255,255,255,0.18)"/>
    </g>
    <text id="Auto_Hint" x="720" y="858" text-anchor="middle" fill="#5A6B60" font-family="Inter, Arial, sans-serif" font-size="12">Défilement auto · survolez pour pause</text>
    <!-- Arrows -->
    <g id="Arrows">
      <circle cx="1240" cy="854" r="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)"/>
      <text x="1240" y="860" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">‹</text>
      <circle cx="1292" cy="854" r="20" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)"/>
      <text x="1292" y="860" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">›</text>
    </g>
  </g>

  <!-- ================== LEGEND STRIP ================== -->
  <g id="11_Legend">
    <g id="Leg_1">
      <rect x="120" y="900" width="200" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)"/>
      <text x="220" y="924" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="800">500</text>
      <text x="220" y="942" text-anchor="middle" fill="#7A9A8A" font-family="Inter, Arial, sans-serif" font-size="11">participants visés</text>
    </g>
    <g id="Leg_2">
      <rect x="332" y="900" width="200" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)"/>
      <text x="432" y="924" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="800">100</text>
      <text x="432" y="942" text-anchor="middle" fill="#7A9A8A" font-family="Inter, Arial, sans-serif" font-size="11">entrepreneurs locaux</text>
    </g>
    <g id="Leg_3">
      <rect x="544" y="900" width="200" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)"/>
      <text x="644" y="924" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="800">30</text>
      <text x="644" y="942" text-anchor="middle" fill="#7A9A8A" font-family="Inter, Arial, sans-serif" font-size="11">médias &amp; influenceurs</text>
    </g>
    <g id="Leg_4">
      <rect x="756" y="900" width="220" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)"/>
      <text x="866" y="924" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="15" font-weight="800">16–17 déc.</text>
      <text x="866" y="942" text-anchor="middle" fill="#7A9A8A" font-family="Inter, Arial, sans-serif" font-size="11">Musée National, Yaoundé</text>
    </g>
    <g id="Leg_5">
      <rect x="988" y="900" width="332" height="56" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)"/>
      <text x="1154" y="924" text-anchor="middle" fill="#FFD506" font-family="Arial Black, Arial, sans-serif" font-size="15" font-weight="800">CAP™</text>
      <text x="1154" y="942" text-anchor="middle" fill="#7A9A8A" font-family="Inter, Arial, sans-serif" font-size="11">Crédible · Accessible · Possible</text>
    </g>
  </g>

  <!-- ================== GUIDE FIGMA (hidden notes) ================== -->
  <g id="12_Figma_Notes" opacity="0">
    <text x="40" y="40" fill="#FFFFFF" font-size="10">IMPORT FIGMA: File → Place image / drag SVG. Ungroup to edit text &amp; colors.</text>
    <text x="40" y="54" fill="#FFFFFF" font-size="10">Active slide = Babadjou (Agriculture). Duplicate Stage group for other 5 mairies.</text>
    <text x="40" y="68" fill="#FFFFFF" font-size="10">Colors: Jaune #FFD506 · Vert #119D63 · Forest #0A2B21 · Night #061A14 · Agri #4F8A3C</text>
  </g>
</svg>
